$kind: http-request
description: "CP-131: el Vigilante intenta corregir la incidencia que registró el Administrador. Responde 404 (igual que si no existiera, para no revelar que existe) y no cambia nada."
url: "{{baseUrl}}/api/incidencias/{{idIncidenciaCorregir}}"
method: PUT
auth:
  type: bearer
  credentials:
    - key: token
      value: "{{tokenVigilante}}"
body:
  type: json
  content: |-
    {
      "idZona": {{idZonaPrueba}},
      "idTipoEvento": {{idTipoPrueba}},
      "idNivelGravedad": {{idNivelPrueba}},
      "descripcion": "Prueba CP-131: corrección de una incidencia ajena"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Código de estado 404', () => pm.response.to.have.status(404));
      const data = pm.response.json();
      pm.test('Mensaje sin revelar que existe', () => pm.expect(data.mensaje).to.eql('La incidencia no existe'));
      pm.test('Formato uniforme de error', () => pm.expect(data).to.include.keys('timestamp', 'status', 'mensaje'));
    language: text/javascript
order: 5020
