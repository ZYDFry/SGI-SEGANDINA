$kind: http-request
url: "{{baseUrl}}/api/usuarios/me/contrasena"
method: PATCH
body:
  type: json
  content: '{"contrasenaActual": "{{contrasenaActual}}", "contrasenaNueva": "{{contrasenaNueva}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Código de estado 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 6500
