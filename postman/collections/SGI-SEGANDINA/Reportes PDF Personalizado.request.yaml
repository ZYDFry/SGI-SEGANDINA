$kind: http-request
url: "{{baseUrl}}/api/reportes/pdf?periodo=PERSONALIZADO&desde={{desde}}&hasta={{hasta}}&idZona=&idNivelGravedad=&idTipoEvento="
method: GET
queryParams:
  periodo: "PERSONALIZADO"
  desde: "{{desde}}"
  hasta: "{{hasta}}"
  idZona: ""
  idNivelGravedad: ""
  idTipoEvento: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('Código de estado 200', () => pm.response.to.have.status(200));
      pm.test('Content-Type del archivo', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/pdf'));
      pm.test('Se descarga como adjunto', () => pm.expect(pm.response.headers.get('Content-Disposition')).to.include('attachment'));
    language: text/javascript
order: 12200
