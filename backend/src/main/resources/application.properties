spring.application.name=sgi-backend

# Conexión a PostgreSQL (Supabase) con el rol app_sgi. Valores desde variables de entorno.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo define docs/modelo_datos.sql: Hibernate nunca crea ni modifica tablas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT (RF-01). El secreto viene de la variable de entorno JWT_SECRET (mínimo 32 caracteres).
jwt.secreto=${JWT_SECRET}
jwt.expiracion=8h
